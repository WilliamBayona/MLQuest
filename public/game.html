<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ML Quest</title>
<style>
  :root { --panel:#221e30; --fg:#f2ead8; --accent:#e16714; --ok:#5fd068; --warn:#f2c14e; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#fff; font-family: ui-monospace, Menlo, Consolas, monospace; }
  canvas { position:fixed; inset:0; width:100vw; height:100vh; object-fit:contain; image-rendering:pixelated; background:#fff; display:block; }
  .bar { position:fixed; left:8px; bottom:8px; display:flex; flex-wrap:wrap; gap:4px 14px; align-items:center; max-width:calc(100vw - 16px);
         padding:6px 10px; border-radius:6px; background:rgba(20,18,28,.82); color:var(--fg); font-size:12px; transition:opacity .4s; }
  .bar.hide { opacity:0; pointer-events:none; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--warn); margin-right:6px; }
  .dot.on { background:var(--ok); }
  a { color:var(--accent); }
  kbd { background:var(--panel); padding:1px 5px; border-radius:3px; }
  #quiz { position:fixed; right:12px; top:12px; width:min(380px, 42vw); max-height:calc(100vh - 24px); overflow:auto;
          background:rgba(20,18,28,.94); color:var(--fg); border:2px solid var(--accent); border-radius:8px; padding:12px 14px; font-size:13px; line-height:1.45; }
  #quiz.hide { display:none; }
  #quiz h2 { margin:0 0 8px; font-size:14px; color:var(--accent); }
  #quiz p { margin:6px 0; }
  #quiz .opt b { display:inline-block; min-width:16px; color:var(--accent); }
  #quiz .rank b { color:var(--ok); }
  #quiz .hint { margin-top:10px; opacity:.75; font-size:12px; }
</style>
</head>
<body>
<canvas id="c" width="1024" height="576"></canvas>
<div id="quiz" class="hide"></div>
<div class="bar" id="bar">
  <span><span class="dot" id="wsDot"></span><span id="wsTxt">conectando…</span></span>
  <span>Telefono: <a id="ctrlUrl" href="/controller">/controller</a></span>
  <span>Teclado: <kbd>←→</kbd> mover · <kbd>Espacio</kbd> saltar · <kbd>Shift</kbd> dash · <kbd>E</kbd> interactuar · <kbd>1–8</kbd> piso en el ascensor · <kbd>K</kbd> morir · <kbd>F</kbd> pantalla completa · <kbd>I</kbd> ocultar info</span>
</div>
<script src="events.js"></script>
<script src="symbols.js"></script>
<script src="game.js"></script>
</body>
</html>
