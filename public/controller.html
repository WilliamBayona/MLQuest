<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ML Quest · Control</title>
<style>
  :root { --bg:#14121c; --panel:#2b2540; --fg:#f2ead8; --accent:#e16714; --ok:#5fd068; --warn:#f2c14e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family: ui-monospace, Menlo, Consolas, monospace; overflow:hidden; touch-action:none; overscroll-behavior:none; }
  .pad { position:fixed; inset:0; display:grid; grid-template-columns:1fr 1fr; align-items:center; padding:max(16px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); gap:16px; }
  .status { position:fixed; top:8px; left:0; right:0; text-align:center; font-size:12px; opacity:.85; pointer-events:none; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--warn); margin-right:6px; }
  .dot.on { background:var(--ok); }
  button { font:inherit; color:var(--fg); background:var(--panel); border:3px solid #0d0b14; border-radius:14px; box-shadow:0 5px 0 #0d0b14; touch-action:none; font-weight:700; }
  button.on { transform:translateY(4px); box-shadow:0 1px 0 #0d0b14; background:var(--accent); }
  .dpad { justify-self:start; display:grid; grid-template-columns:repeat(3, var(--s)); grid-template-rows:repeat(3, var(--s)); --s:min(20vw, 26vh); gap:4px; }
  .dpad button { font-size:calc(var(--s) * .4); border-radius:12px; }
  .dpad [data-b=up] { grid-area:1/2; } .dpad [data-b=left] { grid-area:2/1; }
  .dpad [data-b=right] { grid-area:2/3; } .dpad [data-b=down] { grid-area:3/2; }
  .acts { justify-self:end; position:relative; width:min(44vw, 60vh); height:min(38vw, 52vh); }
  .acts button { position:absolute; border-radius:50%; }
  [data-b=jump] { width:46%; aspect-ratio:1; right:2%; bottom:12%; font-size:clamp(14px,3.5vw,22px); background:#3a5fcd; }
  [data-b=dash] { width:38%; aspect-ratio:1; left:6%; bottom:0; font-size:clamp(12px,3vw,18px); background:#2f8f5b; }
  [data-b=act]  { width:28%; aspect-ratio:1; left:22%; top:0; font-size:clamp(10px,2.3vw,15px); background:#b8862b; }
  /* standing under one of your events: ACCIÓN pulses so you know it opens the question */
  [data-b=act].ready { background:#e0a92e; animation:ready .8s ease-in-out infinite alternate; }
  @keyframes ready { from { box-shadow:0 5px 0 #0d0b14, 0 0 0 0 #ffd23f; } to { box-shadow:0 5px 0 #0d0b14, 0 0 0 7px #ffd23f88; } }
  [data-b=die]  { width:22%; aspect-ratio:1; right:8%; top:0; font-size:clamp(11px,2.4vw,15px); background:#7a2a3a; }
  [data-b].on { background:var(--accent); }
  /* quiz panel: takes over the whole phone, controls hidden, "¿Quién quiere ser millonario?" style */
  body.quizzing .pad, body.quizzing .status { display:none; }
  #quiz { position:fixed; inset:0; z-index:12; background:radial-gradient(ellipse at 50% 0%, #1c2b70 0%, #070b24 75%); color:var(--fg); display:none;
          flex-direction:column; padding:max(10px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
  #quiz.on { display:flex; }
  #quiz header { display:flex; align-items:baseline; gap:10px; flex:0 0 auto; }
  #quiz h1 { margin:0; font-size:14px; color:#f2a531; }
  #quiz .floor { font-size:12px; opacity:.7; }
  #quiz .clock { margin-left:auto; font-size:14px; font-weight:700; }
  #quiz .clock.low { color:#ff7070; }
  #quiz .body { flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y; margin-top:6px; }
  #quiz .body.ask { display:flex; flex-direction:column; gap:8px; overflow:hidden; }
  /* the question box: shrinks and scrolls on its own so the answers always stay on screen */
  #quiz .stem { flex:1 1 auto; min-height:0; display:flex; overflow-y:auto; touch-action:pan-y; text-align:center;
                border:2px solid #9fb3ff; border-radius:16px; background:linear-gradient(#13236a, #050a2a); padding:6px 16px; }
  #quiz .stem > div { margin:auto; }
  #quiz .ctx { font-size:clamp(11px, 2.1vw, 14px); line-height:1.35; margin:0 0 4px; opacity:.9; }
  #quiz .q { font-size:clamp(12px, 2.4vw, 16px); font-weight:700; margin:0; color:#fff; }
  /* answers: 2x2, and a fifth one centred underneath */
  #quiz .opts { flex:0 0 auto; display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; }
  #quiz .opts button { display:flex; gap:8px; align-items:center; text-align:left; min-height:46px; padding:5px 18px;
                       font-size:clamp(11px, 2vw, 14px); line-height:1.25; font-weight:600; color:#fff;
                       border:2px solid #9fb3ff; border-radius:999px; box-shadow:none; background:linear-gradient(#1a2c85, #060d33); }
  #quiz .opts button:nth-child(5) { grid-column:1 / -1; justify-self:center; width:calc(50% - 6px); }
  #quiz .opts button .k { color:#f2a531; font-weight:800; flex:0 0 auto; }
  #quiz .opts button.pick { background:linear-gradient(#ffc451, #d97a0c); color:#14121c; border-color:#fff2c4; }
  #quiz .opts button.pick .k { color:#14121c; }
  #quiz .note { margin:10px 0 0; font-size:13px; text-align:center; opacity:.85; }
  #quiz .rank { display:grid; gap:8px; margin-top:10px; }
  #quiz .rank div { background:var(--panel); border-radius:10px; padding:10px 12px; font-size:14px; }
  #quiz .rank b { color:var(--ok); }
  #quiz .rank .pos { color:var(--accent); font-weight:700; margin-right:6px; }
  #quiz .close { margin-top:10px; padding:10px; font-size:14px; border-radius:10px; background:var(--panel); }
  .rotate { display:none; position:fixed; inset:0; background:var(--bg); z-index:9; align-items:center; justify-content:center; text-align:center; padding:24px; font-size:18px; }
  @media (orientation:portrait) { .rotate { display:flex; } }
</style>
</head>
<body>
<div class="status"><span class="dot" id="dot"></span><span id="txt">conectando…</span></div>
<div class="pad">
  <div class="dpad">
    <button data-b="up">▲</button><button data-b="left">◀</button><button data-b="right">▶</button><button data-b="down">▼</button>
  </div>
  <div class="acts">
    <button data-b="act">ACCIÓN</button>
    <button data-b="die">MORIR</button>
    <button data-b="dash">DASH</button>
    <button data-b="jump">SALTO</button>
  </div>
</div>
<div id="quiz">
  <header><h1 id="qRoom"></h1><span class="floor" id="qFloor"></span><span class="clock" id="qClock"></span></header>
  <div class="body" id="qBody"></div>
</div>
<div class="rotate">Gira el telefono a horizontal ↻</div>
<script>
'use strict';
const state = {};
let ws, slot = '?', games = 0;
const dot = document.getElementById('dot'), txt = document.getElementById('txt');

function send() {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'input', s: { ...state } }));
}
function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?role=controller`);
  ws.onopen = () => { txt.textContent = 'conectado'; send(); };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.t === 'hello') { slot = m.slot; document.title = `ML Quest · J${slot}`; }
    if (m.t === 'ask') showQuestion(m);
    else if (m.t === 'saved') showSaved(m);
    else if (m.t === 'result') showResult(m);
    else if (m.t === 'close') closeQuiz();
    else if (m.t === 'near') actBtn.classList.toggle('ready', !!m.on);
    if (m.t === 'hello' || m.t === 'status') {
      if (m.games !== undefined) games = m.games;
      dot.classList.toggle('on', games > 0);
      txt.textContent = games > 0 ? `Jugador ${slot} · jugando` : `Jugador ${slot} · sin pantalla de juego`;
    }
  };
  ws.onclose = () => { dot.classList.remove('on'); txt.textContent = 'reconectando…'; setTimeout(connect, 800); };
}

// ---- the test: the game sends a question when the character reaches a marked room ----
const quiz = document.getElementById('quiz');
const qRoom = document.getElementById('qRoom'), qFloor = document.getElementById('qFloor');
const qClock = document.getElementById('qClock'), qBody = document.getElementById('qBody');
const actBtn = document.querySelector('[data-b=act]');
let clockTimer = null;

function releaseAll() {
  for (const k in state) state[k] = false;
  document.querySelectorAll('button.on').forEach((b) => b.classList.remove('on'));
  send();
}
function openQuiz() {
  quiz.classList.add('on');
  document.body.classList.add('quizzing');
}
function closeQuiz() {
  quiz.classList.remove('on');
  document.body.classList.remove('quizzing');
  clearInterval(clockTimer); clockTimer = null;
}
function startClock(seconds) {
  let left = seconds;
  qClock.textContent = left + 's';
  clearInterval(clockTimer);
  clockTimer = setInterval(() => {
    left -= 1;
    qClock.textContent = Math.max(0, left) + 's';
    qClock.classList.toggle('low', left <= 10);
    if (left <= 0) clearInterval(clockTimer);
  }, 1000);
}
function showQuestion(m) {
  releaseAll();                       // drop the d-pad so the character stops where it is
  qRoom.textContent = m.room;
  qFloor.textContent = m.floor;
  startClock(m.seconds);
  qBody.innerHTML = '';
  qBody.classList.add('ask');
  const stem = document.createElement('div'); stem.className = 'stem';
  const inner = document.createElement('div');
  const ctx = document.createElement('p'); ctx.className = 'ctx'; ctx.textContent = m.context;
  const q = document.createElement('p'); q.className = 'q'; q.textContent = m.question;
  inner.append(ctx, q); stem.appendChild(inner);
  const list = document.createElement('div'); list.className = 'opts';
  let picked = false;
  m.options.forEach((text, i) => {
    const b = document.createElement('button');
    b.innerHTML = '<span class="k">' + 'ABCDE'[i] + ':</span><span></span>';
    b.lastChild.textContent = text;
    b.addEventListener('click', () => {
      if (picked) return;
      picked = true;
      b.classList.add('pick');                // light up the "final answer" for a moment, then send it
      if (navigator.vibrate) navigator.vibrate(15);
      setTimeout(() => {
        if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'answer', ev: m.ev, choice: i }));
        closeQuiz();
      }, 350);
    });
    list.appendChild(b);
  });
  qBody.append(stem, list);
  openQuiz();
}
function showSaved(m) {
  qRoom.textContent = 'Respuesta guardada';
  qFloor.textContent = m.item || '';
  qClock.textContent = m.collected + '/' + m.total;
  const left = m.total - m.collected;
  qBody.classList.remove('ask');
  qBody.innerHTML = '<p class="note">Te ' + (left === 1 ? 'falta 1 evento' : 'faltan ' + left + ' eventos') +
    '. Busca los signos de admiracion con tu color y oprime ACCION debajo de ellos.</p>';
  openQuiz();
  clearInterval(clockTimer);
  setTimeout(closeQuiz, 1800);
}
function showResult(m) {
  releaseAll();
  clearInterval(clockTimer);
  qRoom.textContent = 'Tus 3 carreras mas afines';
  qFloor.textContent = '';
  qClock.textContent = m.collected + '/' + m.total;
  qBody.innerHTML = '';
  qBody.classList.remove('ask');
  if (!m.top.length || !m.collected) {
    qBody.innerHTML = '<p class="note">Todavia no has respondido nada. Busca los signos de admiracion con tu color.</p>';
  } else {
    const list = document.createElement('div'); list.className = 'rank';
    m.top.forEach((c, i) => {
      const row = document.createElement('div');
      row.innerHTML = '<span class="pos">' + (i + 1) + '</span><b></b> <span></span>';
      row.querySelector('b').textContent = c.name;
      row.querySelector('span:last-child').textContent = c.pct + '%';
      list.appendChild(row);
    });
    qBody.appendChild(list);
  }
  const btn = document.createElement('button'); btn.className = 'close'; btn.textContent = 'Cerrar';
  btn.addEventListener('click', closeQuiz);
  qBody.appendChild(btn);
  openQuiz();
}

// Each button tracks its own pointer, so several can be held at once (multi-touch).
for (const btn of document.querySelectorAll('button[data-b]')) {
  const name = btn.dataset.b;
  const set = (v) => {
    if (!!state[name] === v) return;
    state[name] = v; btn.classList.toggle('on', v); send();
    if (v && navigator.vibrate) navigator.vibrate(8);
  };
  btn.addEventListener('pointerdown', (e) => { e.preventDefault(); btn.setPointerCapture(e.pointerId); set(true); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) btn.addEventListener(ev, () => set(false));
  btn.addEventListener('contextmenu', (e) => e.preventDefault());
}
// block page scrolling, except inside the quiz panel, where long questions need to scroll
document.addEventListener('touchmove', (e) => { if (!quiz.contains(e.target)) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());
addEventListener('blur', () => { for (const k in state) state[k] = false; document.querySelectorAll('.on').forEach((b) => b.classList.remove('on')); send(); });
connect();
</script>
</body>
</html>
