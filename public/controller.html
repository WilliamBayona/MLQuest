<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ML Quest · Control</title>
<style>
  /* the whole controller is drawn in the map's own materials: plank walls, cream boards, black
     outlines, grey floor slabs and the yellow of the ! markers */
  :root { --wood:#debc8b; --plank:#c9a26f; --cream:#f3ead2; --brown:#9e8572; --slab:#696969; --ink:#2b2118; --mark:#ffd23f;
          --planks:repeating-linear-gradient(to bottom, var(--wood) 0 22px, var(--plank) 22px 24px); --ok:#5fd068; --warn:#f2c14e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  html, body { margin:0; height:100%; background:var(--planks); color:var(--ink); font-family: ui-monospace, Menlo, Consolas, monospace; overflow:hidden; touch-action:none; overscroll-behavior:none; }
  .pad { position:fixed; inset:0; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px;
         padding:max(38px, calc(env(safe-area-inset-top) + 30px)) max(24px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); }
  /* status: a grey floor slab across the top */
  .status { position:fixed; top:0; left:0; right:0; text-align:center; font-size:12px; font-weight:700; pointer-events:none;
            padding:max(5px, env(safe-area-inset-top)) 10px 5px; background:var(--slab); color:var(--cream);
            border-bottom:3px solid #000; box-shadow:inset 0 3px 0 #8a8a8a; }
  .dot { display:inline-block; width:10px; height:10px; background:var(--warn); border:2px solid #000; margin-right:6px; vertical-align:-1px; }
  .dot.on { background:var(--ok); }
  /* "?" in the corner of the status slab: opens the onboarding again */
  .help { position:fixed; z-index:2; top:max(3px, env(safe-area-inset-top)); right:max(10px, env(safe-area-inset-right)); width:24px; height:22px; padding:0;
          font-size:13px; background:var(--mark); box-shadow:none; border-width:2px; }
  body.quizzing .help { display:none; }
  button { font:inherit; color:var(--ink); background:var(--cream); border:3px solid #000; border-radius:0;
           box-shadow:inset 0 -5px 0 var(--brown), 0 4px 0 #000; touch-action:none; font-weight:700; }
  button.on { transform:translateY(3px); box-shadow:inset 0 -2px 0 var(--brown), 0 1px 0 #000; background:var(--mark); }
  /* left/right: one compact control split down the middle, [ ◀ | ▶ ] */
  .lr { justify-self:start; display:flex; --s:min(15vw, 24vh); border:3px solid #000; box-shadow:0 4px 0 #000; }
  .lr button { width:calc(var(--s) * 1.3); height:calc(var(--s) * 1.5); border:0; box-shadow:inset 0 -5px 0 var(--brown); font-size:calc(var(--s) * .45); }
  .lr button + button { border-left:3px solid #000; }
  .lr button.on { transform:none; box-shadow:inset 0 -2px 0 var(--brown); }
  .acts { justify-self:end; position:relative; width:min(34vw, 58vh); height:min(30vw, 50vh); }
  .acts button { position:absolute; border-radius:50%; color:#fff; text-shadow:2px 2px 0 #000; box-shadow:inset 0 -5px 0 rgba(0,0,0,.3), 0 4px 0 #000; }
  .acts button.on { box-shadow:inset 0 -2px 0 rgba(0,0,0,.3), 0 1px 0 #000; filter:brightness(1.2); }
  [data-b=jump] { width:46%; aspect-ratio:1; right:2%; bottom:12%; font-size:clamp(14px,3.5vw,22px); background:#3a5fcd; }
  [data-b=dash] { width:38%; aspect-ratio:1; left:6%; bottom:0; font-size:clamp(12px,3vw,18px); background:#2f8f5b; }
  /* the action button: the colour of the markers it opens, with a pointing hand instead of a word */
  [data-b=act]  { width:30%; aspect-ratio:1; left:20%; top:0; padding:0; background:var(--mark); display:grid; place-items:center; }
  [data-b=act] img { width:48%; image-rendering:pixelated; pointer-events:none; }
  [data-b=act].on { background:#e1a400; filter:none; }
  /* standing where it does something: the action button pulses */
  [data-b=act].ready { animation:ready .7s ease-in-out infinite alternate; }
  @keyframes ready { from { box-shadow:inset 0 -5px 0 rgba(0,0,0,.3), 0 4px 0 #000, 0 0 0 0 #fff; }
                     to   { box-shadow:inset 0 -5px 0 rgba(0,0,0,.3), 0 4px 0 #000, 0 0 0 8px #fff; } }
  [data-b=die]  { width:22%; aspect-ratio:1; right:8%; top:0; font-size:clamp(11px,2.4vw,15px); background:#7a2a3a; }
  /* the action button as it appears inside a sentence */
  .acticon { display:inline-grid; place-items:center; width:1.6em; height:1.6em; vertical-align:middle; border-radius:50%;
             background:var(--mark); border:2px solid #000; margin:0 2px; }
  .acticon img { width:62%; image-rendering:pixelated; }
  /* quiz panel: takes over the whole phone with the controls hidden, drawn in the map's own
     materials — plank walls, cream boards, black outlines, grey slabs and the yellow of the markers.
     The lift and the onboarding use this same panel. */
  body.quizzing .pad, body.quizzing .status { display:none; }
  #quiz { --pl:max(14px, env(safe-area-inset-left)); --pr:max(14px, env(safe-area-inset-right));
          position:fixed; inset:0; z-index:12; color:var(--ink); display:none; flex-direction:column;
          background:var(--planks);
          padding:0 var(--pr) max(10px, env(safe-area-inset-bottom)) var(--pl); }
  #quiz.on { display:flex; }
  /* header: a grey floor slab across the top */
  #quiz header { display:flex; align-items:center; gap:10px; flex:0 0 auto; margin:0 calc(-1 * var(--pr)) 0 calc(-1 * var(--pl));
                 padding:max(6px, env(safe-area-inset-top)) var(--pr) 6px var(--pl); background:var(--slab); color:var(--cream);
                 border-bottom:3px solid #000; box-shadow:inset 0 3px 0 #8a8a8a; }
  #quiz h1 { margin:0; font-size:14px; color:var(--mark); text-shadow:2px 2px 0 #000; }
  #quiz .floor { font-size:12px; opacity:.85; }
  #quiz .badge { margin-left:auto; font-size:13px; font-weight:700; background:#000; color:var(--mark); padding:2px 8px; }
  #quiz .badge:empty { display:none; }
  #quiz .body { flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y; margin-top:8px; }
  #quiz .body.ask { display:flex; flex-direction:column; gap:8px; }
  /* the question box: a cream board that fills the free space but never shrinks below its text; on a
     short screen the whole panel scrolls instead, so nothing is ever cut off */
  #quiz .stem { flex:1 0 auto; display:flex; text-align:center;
                background:var(--cream); border:3px solid #000; box-shadow:inset 0 -4px 0 var(--wood), 4px 4px 0 rgba(0,0,0,.3); padding:6px 16px; }
  #quiz .stem > div { margin:auto; }
  #quiz .ctx { font-size:clamp(11px, 2.1vw, 14px); line-height:1.35; margin:0 0 4px; }
  #quiz .q { font-size:clamp(12px, 2.4vw, 16px); font-weight:700; margin:0; }
  /* answers: 2x2, and a fifth one centred underneath */
  #quiz .opts { flex:0 0 auto; display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; }
  #quiz .opts button { display:flex; gap:8px; align-items:center; text-align:left; min-height:46px; padding:5px 10px 9px 6px;
                       font-size:clamp(11px, 2vw, 14px); line-height:1.25; font-weight:600; color:var(--ink);
                       background:var(--cream); border:3px solid #000; border-radius:0; box-shadow:inset 0 -5px 0 var(--brown), 3px 3px 0 rgba(0,0,0,.3); }
  #quiz .opts button:nth-child(5) { grid-column:1 / -1; justify-self:center; width:calc(50% - 5px); }
  /* the letter is a little copy of the ! marker */
  #quiz .opts button .k { flex:0 0 auto; display:grid; place-items:center; width:22px; height:22px; background:var(--mark); color:#000; border:2px solid #000; font-weight:800; }
  #quiz .opts button.pick { background:var(--mark); box-shadow:inset 0 -5px 0 #d99a00, 3px 3px 0 rgba(0,0,0,.3); transform:translateY(2px); }
  #quiz .opts button.pick .k { background:#000; color:var(--mark); }
  #quiz .note { margin:12px auto 0; max-width:560px; font-size:13px; line-height:1.5; text-align:center; background:var(--cream); border:3px solid #000; padding:10px 12px; }
  #quiz .rank { display:grid; gap:8px; margin:6px auto 0; max-width:560px; }
  #quiz .rank div { display:flex; align-items:center; gap:10px; background:var(--cream); border:3px solid #000; box-shadow:inset 0 -4px 0 var(--brown); padding:8px 12px 10px; font-size:14px; }
  #quiz .rank b { flex:1; }
  #quiz .rank .pos { display:grid; place-items:center; width:24px; height:24px; background:var(--mark); border:2px solid #000; font-weight:800; }
  #quiz .close { display:block; margin:10px auto 0; padding:8px 28px; font-size:14px; border-radius:0; color:var(--cream); background:var(--slab); border:3px solid #000; box-shadow:inset 0 3px 0 #8a8a8a, 3px 3px 0 rgba(0,0,0,.3); }
  #quiz .nav { display:flex; justify-content:center; gap:10px; }
  #quiz .nav .close { margin:10px 0 0; }
  #quiz .nav .close.go { background:var(--mark); color:#000; box-shadow:inset 0 -4px 0 #d99a00, 3px 3px 0 rgba(0,0,0,.3); }
  /* the lift's floor panel: black buttons with yellow numbers, like the display over every lift door */
  #quiz .lift { display:grid; grid-template-columns:repeat(4, 56px); gap:10px; justify-content:center; margin:4px auto 0; padding:12px 16px;
                width:max-content; background:var(--cream); border:3px solid #000; box-shadow:inset 0 -4px 0 var(--brown), 4px 4px 0 rgba(0,0,0,.3); }
  #quiz .lift button { height:48px; border-radius:50%; background:#000; color:var(--mark); font-size:20px; border-color:#555; box-shadow:0 3px 0 #555; }
  #quiz .lift button.here { background:var(--mark); color:#000; border-color:#000; box-shadow:none; }
  /* onboarding: the map's symbols, each drawn exactly as on the big screen, with what it means */
  #quiz .legend { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; max-width:900px; margin:0 auto; }
  #quiz .legend > div { display:flex; align-items:center; gap:10px; background:var(--cream); border:3px solid #000;
                        box-shadow:inset 0 -4px 0 var(--brown); padding:6px 8px 9px; font-size:11px; line-height:1.3; }
  #quiz .legend .sym { flex:0 0 64px; height:56px; display:grid; place-items:center; }
  #quiz .legend canvas, #quiz .legend .mini { image-rendering:pixelated; }
  #quiz .legend b { display:block; font-size:12px; margin-bottom:1px; }
  #quiz .legend .mini { width:32px; height:32px; background:url(sprites/Idle.png) 0 0 / 128px 32px no-repeat; animation:idle2 .67s steps(4) infinite; }
  @keyframes idle2 { to { background-position:-128px 0; } }
  #quiz .legend .tag { font-weight:800; font-size:12px; text-shadow:1px 1px 0 #000; text-align:center; }
  #quiz .keys { display:grid; grid-template-columns:repeat(5, 1fr); gap:8px; max-width:900px; margin:0 auto; }
  #quiz .keys > div { display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; background:var(--cream); border:3px solid #000;
                      box-shadow:inset 0 -4px 0 var(--brown); padding:8px 6px 10px; font-size:11px; line-height:1.3; }
  #quiz .keys .k2 { display:grid; place-items:center; height:40px; min-width:40px; padding:0 6px; border:3px solid #000; border-radius:50%; color:#fff; font-weight:800; font-size:10px; text-shadow:1px 1px 0 #000; }
  #quiz .keys .lrk { border-radius:0; background:var(--cream); color:var(--ink); text-shadow:none; font-size:14px; padding:0; display:flex; }
  #quiz .keys .lrk span { padding:6px 8px; } #quiz .keys .lrk span + span { border-left:3px solid #000; }
  #quiz .steps { max-width:640px; margin:0 auto; padding:8px 14px 8px 34px; background:var(--cream); border:3px solid #000; box-shadow:inset 0 -4px 0 var(--brown);
                 font-size:13px; line-height:1.55; }
  @media (max-height:340px) {
    #quiz header { padding-top:max(3px, env(safe-area-inset-top)); padding-bottom:3px; }
    #quiz h1, #quiz .badge { font-size:12px; }
    #quiz .body { margin-top:5px; }
    #quiz .body.ask, #quiz .opts { gap:5px 8px; }
    #quiz .stem { padding:4px 12px; }
    #quiz .ctx { font-size:11px; }
    #quiz .q { font-size:12px; }
    #quiz .opts button { min-height:38px; font-size:11px; padding:3px 8px 7px 5px; }
    #quiz .legend .sym { height:44px; }
  }
  /* character preview: every phone gets a different colour, so show the student which one is theirs */
  .me { justify-self:center; visibility:hidden; display:flex; flex-direction:column; align-items:center; gap:4px;
        pointer-events:none; font-size:11px; font-weight:700; }
  .me.on { visibility:visible; }
  .me .frame { padding:6px 8px 4px; background:#f3ead2; border:3px solid #000; box-shadow:inset 0 -4px 0 #debc8b; }
  .me .sprite { width:64px; height:64px; background:url(sprites/Idle.png) 0 0 / 256px 64px no-repeat; image-rendering:pixelated; animation:idle .67s steps(4) infinite; }
  @keyframes idle { to { background-position:-256px 0; } }
  .me b { font-size:14px; text-shadow:2px 2px 0 #000; }
  .rotate { display:none; position:fixed; inset:0; background:var(--planks); font-weight:700; z-index:9; align-items:center; justify-content:center; text-align:center; padding:24px; font-size:18px; }
  @media (orientation:portrait) { .rotate { display:flex; } }
</style>
</head>
<body>
<div class="status"><span class="dot" id="dot"></span><span id="txt">conectando…</span></div>
<button class="help" id="help" aria-label="Cómo jugar">?</button>
<div class="pad">
  <div class="lr">
    <button data-b="left" aria-label="Izquierda">◀</button><button data-b="right" aria-label="Derecha">▶</button>
  </div>
  <div class="me" id="me"><span>Tu personaje</span><div class="frame"><div class="sprite" id="meSprite"></div></div><b id="meTag"></b></div>
  <div class="acts">
    <button data-b="act" aria-label="Interactuar"><img id="actImg" alt=""></button>
    <button data-b="die">MORIR</button>
    <button data-b="dash">DASH</button>
    <button data-b="jump">SALTO</button>
  </div>
</div>
<div id="quiz">
  <header><h1 id="qRoom"></h1><span class="floor" id="qFloor"></span><span class="badge" id="qBadge"></span></header>
  <div class="body" id="qBody"></div>
</div>
<div class="rotate">Gira el telefono a horizontal ↻</div>
<script src="events.js"></script>
<script src="symbols.js"></script>
<script>
'use strict';
const state = {};
let ws, slot = '?', games = 0, progress = null, retryTimer = null;
const dot = document.getElementById('dot'), txt = document.getElementById('txt');

// This phone's key, kept across reloads: the server makes the player's id from it, so after a
// dropped connection the phone comes back as the same player, with its answers and its colour.
const KEY = (() => {
  const fresh = () => [...crypto.getRandomValues(new Uint8Array(10))].map((b) => b.toString(16).padStart(2, '0')).join('');
  try {
    let k = localStorage.getItem('mlquest-key');
    if (!k) { k = fresh(); localStorage.setItem('mlquest-key', k); }
    return k;
  } catch { return fresh(); }
})();
const store = {   // per-phone flags; if storage is blocked they just last as long as the page
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// the same tint and tag colour the game gives this slot (HUES / LABEL_COLORS in game.js); CSS
// hue-rotate is the very colour matrix the game applies to the sprite sheets
const HUES = [0, 200, 100, 290];
const LABEL_COLORS = ['#e16714', '#4aa3ff', '#5fd068', '#c76bff'];
const hueFilter = () => { const h = HUES[(slot - 1) % HUES.length]; return h ? `hue-rotate(${h}deg)` : ''; };
const tagColor = () => LABEL_COLORS[(slot - 1) % LABEL_COLORS.length];
function showCharacter() {
  document.getElementById('meSprite').style.filter = hueFilter();
  const tag = document.getElementById('meTag');
  tag.textContent = 'P' + slot;
  tag.style.color = tagColor();
  document.getElementById('me').classList.add('on');
}
function showStatus() {
  dot.classList.toggle('on', games > 0);
  txt.textContent = games === 0 ? 'buscando la pantalla de juego…'
    : !progress ? `Jugador ${slot} · jugando`
    : progress.collected >= progress.total ? `Jugador ${slot} · ${progress.total}/${progress.total} · ve al árbol del piso ${TOP_FLOOR}`
    : `Jugador ${slot} · ${progress.collected}/${progress.total} eventos`;
}

function send(msg = { t: 'input', s: { ...state } }) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg));
}
function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?role=controller&key=${KEY}`);
  ws.onopen = () => { txt.textContent = 'conectado'; send(); };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.t === 'hello') {
      slot = m.slot; document.title = `ML Quest · J${slot}`; progress = null; showCharacter();
      if (panel !== 'intro') closeQuiz();   // a fresh connection: whatever the game had open is gone
      if (!store.get('mlquest-intro')) showIntro(0);
    }
    if (m.t === 'ask') showQuestion(m);
    else if (m.t === 'saved') showSaved(m);
    else if (m.t === 'notice') showNotice(m);
    else if (m.t === 'result') showResult(m);
    else if (m.t === 'lift') showLift(m);
    else if (m.t === 'close') closeQuiz();
    else if (m.t === 'near') actBtn.classList.toggle('ready', !!m.on);
    else if (m.t === 'progress') { progress = m; showStatus(); }
    if (m.t === 'hello' || m.t === 'status') {
      if (m.games !== undefined) games = m.games;
      showStatus();
      // On a host that runs several copies of the server (Vercel), this phone can land on a copy the
      // game screen is not connected to. If no game shows up soon, reconnect and try another copy.
      clearTimeout(retryTimer);
      if (games === 0) retryTimer = setTimeout(() => { if (games === 0) ws.close(); }, 2500);
    }
  };
  ws.onclose = () => { dot.classList.remove('on'); txt.textContent = 'reconectando…'; setTimeout(connect, 800); };
}

// ---- the action button's icon, on the button and wherever a message mentions it ----
const HAND_URL = bitmapURL(HAND, 2);
document.getElementById('actImg').src = HAND_URL;
function actIcon() {
  const s = document.createElement('span'); s.className = 'acticon';
  const i = document.createElement('img'); i.src = HAND_URL; i.alt = 'botón de interactuar';
  s.appendChild(i);
  return s;
}
// text in which {act} stands for the action button
function richText(el, text) {
  text.split('{act}').forEach((part, i) => { if (i) el.appendChild(actIcon()); el.appendChild(document.createTextNode(part)); });
  return el;
}
const note = (text) => richText(Object.assign(document.createElement('p'), { className: 'note' }), text);
function panelButton(label, onClick, go = false) {
  const b = document.createElement('button'); b.className = 'close' + (go ? ' go' : ''); b.textContent = label;
  b.addEventListener('click', onClick);
  return b;
}

// ---- the panel: questions, notices, results, the lift and the onboarding all take over the phone here ----
const quiz = document.getElementById('quiz');
const qRoom = document.getElementById('qRoom'), qFloor = document.getElementById('qFloor');
const qBadge = document.getElementById('qBadge'), qBody = document.getElementById('qBody');
const actBtn = document.querySelector('[data-b=act]');
let flashTimer = null, panel = null;

function releaseAll() {
  for (const k in state) state[k] = false;
  document.querySelectorAll('button.on').forEach((b) => b.classList.remove('on'));
  send();
}
function openQuiz(kind) {
  clearTimeout(flashTimer);
  panel = kind;
  quiz.classList.add('on');
  document.body.classList.add('quizzing');
}
function closeQuiz() {
  panel = null;
  quiz.classList.remove('on');
  document.body.classList.remove('quizzing');
}
function setHeader(title, floor, badge) {
  qRoom.textContent = title; qFloor.textContent = floor || ''; qBadge.textContent = badge || '';
  qBody.innerHTML = ''; qBody.classList.remove('ask');
}
// the corner of the header shows how far along this player is, e.g. 2/4
const progressBadge = () => (progress ? progress.collected + '/' + progress.total : '');
function showQuestion(m) {
  releaseAll();                       // drop the controls so the character stops where it is
  setHeader(m.room, m.floor, progressBadge());
  qBody.classList.add('ask');
  const stem = document.createElement('div'); stem.className = 'stem';
  const inner = document.createElement('div');
  const ctx = document.createElement('p'); ctx.className = 'ctx'; ctx.textContent = m.context;
  const q = document.createElement('p'); q.className = 'q'; q.textContent = m.question;
  inner.append(ctx, q); stem.appendChild(inner);
  const list = document.createElement('div'); list.className = 'opts';
  let picked = false;
  m.options.forEach((text, i) => {
    const b = document.createElement('button');
    b.innerHTML = '<span class="k">' + 'ABCDE'[i] + '</span><span></span>';
    b.lastChild.textContent = text;
    b.addEventListener('click', () => {
      if (picked) return;
      picked = true;
      b.classList.add('pick');                // light up the "final answer" for a moment, then send it
      if (navigator.vibrate) navigator.vibrate(15);
      setTimeout(() => { send({ t: 'answer', ev: m.ev, choice: i }); closeQuiz(); }, 350);
    });
    list.appendChild(b);
  });
  qBody.append(stem, list);
  openQuiz('ask');
}
function showSaved(m) {
  const left = m.total - m.collected;
  setHeader('Respuesta guardada', m.room, m.collected + '/' + m.total);
  qBody.appendChild(note(`Te ${left === 1 ? 'falta 1 evento' : `faltan ${left} eventos`}. Busca otro signo de admiración y oprime {act} debajo de él.`));
  openQuiz('saved');
  flashTimer = setTimeout(closeQuiz, 1800);
}
function showNotice(m) {
  releaseAll();
  setHeader(m.title, '', progressBadge());
  qBody.appendChild(note(m.text));
  if (m.stay) qBody.appendChild(panelButton('Entendido', closeQuiz));
  openQuiz('notice');
  if (!m.stay) flashTimer = setTimeout(closeQuiz, 2500);
}
function showResult(m) {
  releaseAll();
  setHeader('Tus 3 carreras mas afines', '', m.collected + '/' + m.total);
  if (!m.top.length || !m.collected) {
    qBody.appendChild(note('Todavía no has respondido nada. Busca los signos de admiración del edificio.'));
  } else {
    const list = document.createElement('div'); list.className = 'rank';
    m.top.forEach((c, i) => {
      const row = document.createElement('div');
      row.innerHTML = '<span class="pos">' + (i + 1) + '</span><b></b> <span></span>';
      row.querySelector('b').textContent = c.name;
      row.querySelector('span:last-child').textContent = c.pct + '%';
      list.appendChild(row);
    });
    qBody.appendChild(list);
  }
  qBody.appendChild(panelButton('Cerrar', closeQuiz));
  openQuiz('result');
}
// the lift: a button per floor, top floors on the top row, as on a real lift panel
function showLift(m) {
  releaseAll();
  setHeader('Ascensor', `Estás en el piso ${m.current}`, progressBadge());
  const grid = document.createElement('div'); grid.className = 'lift';
  const half = Math.ceil(m.floors.length / 2);
  const order = [...m.floors.slice(half), ...m.floors.slice(0, half)];
  for (const n of order) {
    const b = document.createElement('button'); b.textContent = n;
    if (n === m.current) { b.classList.add('here'); b.disabled = true; }
    b.addEventListener('click', () => { send({ t: 'floor', n }); closeQuiz(); });
    grid.appendChild(b);
  }
  qBody.append(grid, panelButton('Cerrar', () => { send({ t: 'liftClose' }); closeQuiz(); }));
  openQuiz('lift');
}

// ---- onboarding: what the map's symbols mean, the controls, and the goal ----
// The symbols are drawn with the game's own drawing code (symbols.js) and cut from the real map, so
// each one looks here exactly as it does on the big screen.
const mapImg = new Image(); mapImg.src = 'ML.png';
function symbolCanvas(w, h, scale, paint) {
  // drawn at the phone's real resolution: the signs come out smooth, the pixel art stays crisp
  const k = scale * (devicePixelRatio || 1);
  const c = document.createElement('canvas'); c.width = Math.ceil(w * k); c.height = Math.ceil(h * k);
  c.style.width = w * scale + 'px'; c.style.height = h * scale + 'px';
  const g = c.getContext('2d'); g.setTransform(k, 0, 0, k, 0, 0); g.imageSmoothingEnabled = false;
  const go = () => paint(g);
  if (mapImg.complete) go(); else mapImg.addEventListener('load', go, { once: true });
  return c;
}
function legendItem(sym, title, text) {
  const d = document.createElement('div');
  const s = document.createElement('div'); s.className = 'sym'; s.appendChild(sym);
  const t = document.createElement('div');
  t.appendChild(Object.assign(document.createElement('b'), { textContent: title }));
  richText(t, text);
  d.append(s, t);
  return d;
}
function mapSymbols() {
  const firstLab = LABS[EVENTS[0].lab], door = LIFT.door, liftRow = LIFT.doorFrom, dw = door.x1 - door.x0 + 1, dh = door.bottom - door.top + 1;
  const me = document.createElement('div');
  const mini = document.createElement('div'); mini.className = 'mini'; mini.style.filter = hueFilter();
  const tag = document.createElement('div'); tag.className = 'tag'; tag.textContent = 'P' + slot; tag.style.color = tagColor();
  me.append(tag, mini);
  const treeX = GOAL.x - 14, treeY = GOAL.row - 48;
  return [
    legendItem(symbolCanvas(16, 18, 3, (g) => drawBang(g, 8, 16)), 'Evento',
      'Párate debajo y oprime {act} para responder su pregunta.'),
    legendItem(symbolCanvas(labSignWidth(document.createElement('canvas').getContext('2d'), firstLab) + 2, 13, 2, (g) => drawLabSign(g, (labSignWidth(g, firstLab) + 2) / 2, 1, firstLab)), 'Laboratorio',
      'El letrero de color dice qué laboratorio es.'),
    legendItem(symbolCanvas(dw, dh + 13, 2, (g) => { drawFloorTag(g, LIFT.x - door.x0, 0, 2); g.drawImage(mapImg, door.x0, liftRow + door.top, dw, dh, 0, 13, dw, dh); }), 'Ascensor',
      `Frente a sus puertas oprime {act} y elige un piso del 1 al ${TOP_FLOOR}.`),
    legendItem(symbolCanvas(13, 12, 3, (g) => drawFloorTag(g, 6, 1, 3)), 'Número de piso',
      `Sobre cada ascensor. Los pisos van del 1 al ${TOP_FLOOR}.`),
    legendItem(symbolCanvas(66, 50, 1, (g) => { g.drawImage(mapImg, treeX, treeY, 66, 50, 0, 0, 66, 50); drawStar(g, GOAL.x - treeX, GOAL.row - 20 - treeY); }), 'Árbol (piso ' + TOP_FLOOR + ')',
      `Con tus ${EVENTS_PER_PLAYER} eventos listos, oprime {act} junto a la estrella para ver tus resultados.`),
    legendItem(me, 'Tú', 'Tu personaje y tu etiqueta, del mismo color que en la pantalla.'),
  ];
}
function controlKeys() {
  const key = (html, bg, text) => {
    const d = document.createElement('div');
    const k = document.createElement('span'); k.className = 'k2'; if (bg) k.style.background = bg; k.innerHTML = html;
    d.appendChild(k); richText(d, text);
    return d;
  };
  const act = key('', '#ffd23f', 'Interactuar: eventos, ascensor y árbol');
  act.firstChild.appendChild(Object.assign(document.createElement('img'), { src: HAND_URL, style: 'width:20px;image-rendering:pixelated' }));
  const lr = key('<span>◀</span><span>▶</span>', '', 'Moverte a los lados');
  lr.firstChild.classList.add('lrk');
  return [lr, key('SALTO', '#3a5fcd', 'Saltar escalones y muebles'), key('DASH', '#2f8f5b', 'Impulso rápido'), act,
    key('MORIR', '#7a2a3a', 'Vuelves al inicio; tus respuestas se guardan')];
}
const INTRO = [
  { title: 'Símbolos del mapa', body: () => { const g = document.createElement('div'); g.className = 'legend'; g.append(...mapSymbols()); return g; } },
  { title: 'Controles', body: () => { const g = document.createElement('div'); g.className = 'keys'; g.append(...controlKeys()); return g; } },
  { title: 'Tu misión', body: () => {
    const ol = document.createElement('ol'); ol.className = 'steps';
    for (const s of [
      'Recorre el edificio y busca los signos de admiración: cada uno es un evento de un laboratorio.',
      `Párate debajo y oprime {act}. Responde ${EVENTS_PER_PLAYER} eventos distintos, sin límite de tiempo.`,
      `Para cambiar de piso usa las escaleras o el ascensor (pisos 1 a ${TOP_FLOOR}).`,
      `Cuando termines, ve al árbol del piso ${TOP_FLOOR} y oprime {act} para ver tus 3 carreras más afines.`,
    ]) ol.appendChild(richText(document.createElement('li'), s));
    return ol;
  } },
];
function showIntro(i) {
  releaseAll();
  setHeader(INTRO[i].title, 'Cómo jugar', `${i + 1}/${INTRO.length}`);
  const nav = document.createElement('div'); nav.className = 'nav';
  if (i > 0) nav.appendChild(panelButton('◀ Anterior', () => showIntro(i - 1)));
  if (i < INTRO.length - 1) nav.appendChild(panelButton('Siguiente ▶', () => showIntro(i + 1), true));
  else nav.appendChild(panelButton('¡A jugar!', () => { store.set('mlquest-intro', '1'); closeQuiz(); }, true));
  qBody.append(INTRO[i].body(), nav);
  openQuiz('intro');
}
document.getElementById('help').addEventListener('click', () => showIntro(0));

// Each button tracks its own pointer, so several can be held at once (multi-touch).
for (const btn of document.querySelectorAll('button[data-b]')) {
  const name = btn.dataset.b;
  const set = (v) => {
    if (!!state[name] === v) return;
    state[name] = v; btn.classList.toggle('on', v); send();
    if (v && navigator.vibrate) navigator.vibrate(8);
  };
  btn.addEventListener('pointerdown', (e) => { e.preventDefault(); btn.setPointerCapture(e.pointerId); set(true); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) btn.addEventListener(ev, () => set(false));
  btn.addEventListener('contextmenu', (e) => e.preventDefault());
}
// block page scrolling, except inside the quiz panel, where long questions need to scroll
document.addEventListener('touchmove', (e) => { if (!quiz.contains(e.target)) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());
addEventListener('blur', () => { for (const k in state) state[k] = false; document.querySelectorAll('.on').forEach((b) => b.classList.remove('on')); send(); });
connect();
</script>
</body>
